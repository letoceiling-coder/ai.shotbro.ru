packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@nestjs/core": true
  "@scarf/scarf": true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - sharp
  - esbuild
  - unrs-resolver
  - core-js-pure
  - msgpackr-extract
