x-web-logging: &web-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${WEB_IMAGE:-infra-web:latest}
    logging: *web-logging
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        BUILD_SHA: ${WEB_BUILD_SHA:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-https://ai.shotbro.ru}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://ai.shotbro.ru}
    ports:
      - "127.0.0.1:3020:3000"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file:
      - path: ../.env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://shotbro:${POSTGRES_PASSWORD:-shotbro}@postgres:5432/shotbro
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-https://ai.shotbro.ru}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production-32chars-min}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-https://ai.shotbro.ru}
      OPENROUTER_ENABLED: "false"
    ports:
      - "127.0.0.1:3021:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - path: ../.env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://shotbro:${POSTGRES_PASSWORD:-shotbro}@postgres:5432/shotbro
      REDIS_URL: redis://redis:6379
      OPENROUTER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shotbro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shotbro}
      POSTGRES_DB: shotbro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotbro -d shotbro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
