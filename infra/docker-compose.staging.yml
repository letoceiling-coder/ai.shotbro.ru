# Isolated staging for ai.shotbro.ru Phase 2 — NOT studio.shotbro.ru stacks
name: ai-shotbro-staging

x-logging: &staging-logging
  driver: json-file
  options:
    max-size: "30m"
    max-file: "4"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shotbro_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?set STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: shotbro_staging
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotbro_staging -d shotbro_staging"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [staging_internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging_redis:/data
    networks: [staging_internal]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STAGING_MINIO_USER:-shotbro_staging_minio}
      MINIO_ROOT_PASSWORD: ${STAGING_MINIO_PASSWORD:?set STAGING_MINIO_PASSWORD}
    volumes:
      - staging_minio:/data
    ports:
      - "127.0.0.1:9003:9000"
    networks: [staging_internal]

  migrate:
    image: ${SHOTBRO_API_IMAGE:-shotbro/api:current}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      args:
        BUILD_SHA: ${DEPLOY_SHA:-dev}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://shotbro_staging:${STAGING_POSTGRES_PASSWORD}@postgres:5432/shotbro_staging
    entrypoint: ["sh", "-c", "cd packages/db && pnpm exec drizzle-kit migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [staging_internal]

  api:
    image: ${SHOTBRO_API_IMAGE:-shotbro/api:current}
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
      args:
        BUILD_SHA: ${DEPLOY_SHA:-dev}
    restart: unless-stopped
    logging: *staging-logging
    env_file:
      - path: ./staging.env
        required: true
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://shotbro_staging:${STAGING_POSTGRES_PASSWORD}@postgres:5432/shotbro_staging
      REDIS_URL: redis://redis:6379
      APP_URL: https://ai.shotbro.ru
      TRUSTED_ORIGINS: https://ai.shotbro.ru,http://127.0.0.1:3000
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_ALLOW_PAID_REQUESTS: "false"
      LLM_LIVE_EXECUTION_ENABLED: ${LLM_LIVE_EXECUTION_ENABLED:-false}
      MEDIA_GENERATION_ENABLED: ${MEDIA_GENERATION_ENABLED:-false}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      VIDEO_GENERATION_ENABLED: ${VIDEO_GENERATION_ENABLED:-false}
      IMAGE_UPSCALE_ENABLED: ${IMAGE_UPSCALE_ENABLED:-false}
      MEDIA_PROVIDER_LIVE_EXECUTION_ENABLED: ${MEDIA_PROVIDER_LIVE_EXECUTION_ENABLED:-false}
      PROVIDER_LIVE_EXECUTION_ENABLED: "false"
      AI_MOCK_MODE: "true"
      PHASE4_AGENT_RUNTIME_ENABLED: ${PHASE4_AGENT_RUNTIME_ENABLED:-false}
      PHASE4_PROJECT_SCOPED_ENABLED: ${PHASE4_PROJECT_SCOPED_ENABLED:-false}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://ai.shotbro.ru}
      S3_REGION: us-east-1
      S3_BUCKET: shotbro-staging
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${STAGING_MINIO_USER:-shotbro_staging_minio}
      S3_SECRET_ACCESS_KEY: ${STAGING_MINIO_PASSWORD}
      SECRETS_ROTATED: "true"
    ports:
      - "127.0.0.1:3021:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [staging_internal]

  worker:
    image: ${SHOTBRO_WORKER_IMAGE:-shotbro/worker:current}
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
      args:
        BUILD_SHA: ${DEPLOY_SHA:-dev}
    restart: unless-stopped
    logging: *staging-logging
    env_file:
      - path: ./staging.env
        required: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://shotbro_staging:${STAGING_POSTGRES_PASSWORD}@postgres:5432/shotbro_staging
      REDIS_URL: redis://redis:6379
      OPENROUTER_ENABLED: ${OPENROUTER_ENABLED:-false}
      OPENROUTER_ALLOW_PAID_REQUESTS: "false"
      LLM_LIVE_EXECUTION_ENABLED: ${LLM_LIVE_EXECUTION_ENABLED:-false}
      MEDIA_GENERATION_ENABLED: ${MEDIA_GENERATION_ENABLED:-false}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      VIDEO_GENERATION_ENABLED: ${VIDEO_GENERATION_ENABLED:-false}
      IMAGE_UPSCALE_ENABLED: ${IMAGE_UPSCALE_ENABLED:-false}
      MEDIA_PROVIDER_LIVE_EXECUTION_ENABLED: ${MEDIA_PROVIDER_LIVE_EXECUTION_ENABLED:-false}
      PROVIDER_LIVE_EXECUTION_ENABLED: "false"
      AI_MOCK_MODE: "true"
      PHASE4_AGENT_RUNTIME_ENABLED: ${PHASE4_AGENT_RUNTIME_ENABLED:-false}
      PHASE4_PROJECT_SCOPED_ENABLED: ${PHASE4_PROJECT_SCOPED_ENABLED:-false}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://ai.shotbro.ru}
      S3_REGION: us-east-1
      S3_BUCKET: shotbro-staging
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${STAGING_MINIO_USER:-shotbro_staging_minio}
      S3_SECRET_ACCESS_KEY: ${STAGING_MINIO_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks: [staging_internal]

networks:
  staging_internal:
    driver: bridge

volumes:
  staging_pgdata:
  staging_redis:
  staging_minio:
