# Local / CI test stack — NOT production
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shotbro
      POSTGRES_PASSWORD: shotbro_test
      POSTGRES_DB: shotbro_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotbro -d shotbro_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_test
      MINIO_ROOT_PASSWORD: minio_test_secret_12
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_test_data:
  minio_data:
